name: Build Soutak AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Extract project
        run: |
          unzip -q SoutakAI.zip
          ls -la SoutakAI

      - name: Build Debug APK
        run: |
          gradle -p SoutakAI assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoutakAI-debug-apk
          path: SoutakAI/app/build/outputs/apk/debug/app-debug.apk
